[package]
name = "jarbasd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jarbas shell AI daemon for Redox AIOS (chat HUD + Soul Mirror)"

[[bin]]
name = "jarbasd"
path = "src/main.rs"

[[bin]]
name = "jarbas"
path = "src/bin/jarbas.rs"

[dependencies]
jarbas-core = { path = "../../jarbas-core" }
agent-core = { path = "../../agent-core" }
event-bus = { path = "../../event-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
