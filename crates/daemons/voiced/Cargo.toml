[package]
name = "voiced"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice pipeline daemon for Redox AIOS (Jarvis stub)"

[[bin]]
name = "voiced"
path = "src/main.rs"

[[bin]]
name = "voice"
path = "src/bin/voice.rs"

[dependencies]
voice-core = { path = "../../voice-core" }
event-bus = { path = "../../event-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
